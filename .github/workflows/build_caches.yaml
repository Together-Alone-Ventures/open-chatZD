on:
  push:
    branches:
      - master

name: Build caches

jobs:
  build_all_debug:
    name: Build all in debug mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require CVDR_VERIFY_READ_TOKEN
        env:
          CVDR_VERIFY_READ_TOKEN: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
        run: |
          if [ -z "${CVDR_VERIFY_READ_TOKEN}" ]; then
            echo "::error::CVDR_VERIFY_READ_TOKEN is required (private git deps: ICP-Delete-Leaf, zombie-core)."
            exit 1
          fi
      - uses: ./.github/workflows/setup-rust
        with:
          cache: write
          private_git_token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --tests
