on:
  pull_request:
    branches:
      - master
      - antek
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

name: Backend linting and unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: run fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      - uses: actions-rust-lang/rustfmt@v1

  clippy:
    name: run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require CVDR_VERIFY_READ_TOKEN
        env:
          CVDR_VERIFY_READ_TOKEN: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
        run: |
          if [ -z "${CVDR_VERIFY_READ_TOKEN}" ]; then
            echo "::error::CVDR_VERIFY_READ_TOKEN is required (private git deps: ICP-Delete-Leaf, zombie-core, CVDR-Verify)."
            exit 1
          fi
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
          private_git_token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests -- -D warnings

  unit_tests:
    name: run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require CVDR_VERIFY_READ_TOKEN
        env:
          CVDR_VERIFY_READ_TOKEN: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
        run: |
          if [ -z "${CVDR_VERIFY_READ_TOKEN}" ]; then
            echo "::error::CVDR_VERIFY_READ_TOKEN is required (private git deps: ICP-Delete-Leaf, zombie-core, CVDR-Verify)."
            exit 1
          fi
      - name: Clear any PR-supplied CVDR-Verify stub
        run: rm -rf CVDR-Verify
      - name: Checkout CVDR-Verify sibling @ immutable SHA (pre-release pin)
        uses: actions/checkout@v4
        with:
          repository: Together-Alone-Ventures/CVDR-Verify
          # Immutable SHA of CVDR-Verify branch `openchatzd-v5` (560e483 mktd02-v5 merged with the
          # OpenChat line ac64c1b, the suite-v5 OpenChat verifier — Brief B1 step 5 — the Step 9
          # corpus mirror, which the LUI mirror guard requires in the sibling checkout, and the
          # 2026-10-01 G decisions: timing label BEFORE_COMMITMENT_CERTIFICATE, historical
          # PortablePackageV2 -> NOT_ATTESTED). The LUI label guard requires those definitions.
          # Release tags are minted once, at freeze (Stef standing rule: `openchatzd-v0.8.0` on this
          # commit) — never used for CI pins.
          ref: b2547880c1dfda6304a097e97fb74fb640002f9f
          path: CVDR-Verify
          token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
      - name: Require sibling OpenChatZD attestation module
        run: test -f CVDR-Verify/mktd02/mktd02-verify/src/openchatzd/index_attestation.rs
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
          private_git_token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --exclude integration_tests

  # The two `#[ignore]`d PocketIC upgrade tests (`r3_upgrade_from_c744de1_keeps_state_and_function`,
  # `v1_in_flight_draft_blocks_upgrade_then_terminal_draft_survives_it`) upgrade a deployment
  # installed from the c744de1 baseline wasms to the current wasms. Manual (workflow_dispatch) or on
  # a PR labelled `run-upgrade-baseline`, on a stock 2-core runner.
  # Baseline = release asset, not a build: the loader (`wasms::baseline_c744de1`) needs only
  # openchat_installer, user_index, local_user_index and user, but pins their ALL-CANISTER-recipe
  # hashes (BASELINE_c744de1.md §3.2) — a subset build unifies features differently (§3: the
  # single-canister LUI differs) and the full c744de1 build does not fit this runner. The four files
  # are attached once to the release `baseline-c744de1-wasms` (target c744de1):
  #   gh release create baseline-c744de1-wasms --target c744de1a1124f9320354946d83cfc3da68133967 \
  #     --prerelease --title "c744de1 baseline wasms" --notes "BASELINE_c744de1.md §3.2" \
  #     wasms/baseline_c744de1/{openchat_installer,user_index,local_user_index,user}.wasm.gz
  # Each download must equal a pinned hash in backend/integration_tests/src/wasms.rs, and the test
  # checks it again on load. Current wasms are built on the runner (no token, no Docker).
  upgrade-baseline:
    name: baseline upgrade tests (c744de1 -> current, ignored)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-upgrade-baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      BASELINE_RELEASE_TAG: baseline-c744de1-wasms
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Download c744de1 baseline wasms (release asset, hash-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=wasms/baseline_c744de1
          mkdir -p "$dir"
          gh release download "$BASELINE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.wasm.gz' --dir "$dir" || {
            echo "::error::release '$BASELINE_RELEASE_TAG' with the four c744de1 baseline wasms is missing (see the job comment)"
            exit 1
          }
          for c in openchat_installer user_index local_user_index user; do
            f="$dir/$c.wasm.gz"
            [ -f "$f" ] || { echo "::error::$f missing from release '$BASELINE_RELEASE_TAG'"; exit 1; }
            h=$(sha256sum "$f" | cut -d' ' -f1)
            grep -q "\"$h\"" backend/integration_tests/src/wasms.rs || {
              echo "::error::$f sha256 $h is not a pinned c744de1 baseline hash (wasms.rs / BASELINE §3.2)"
              exit 1
            }
            echo "$h  $f"
          done
      - uses: ./.github/workflows/setup-rust
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build current wasms (all-canister script, on the runner)
        run: bash ./scripts/generate-all-canister-wasms.sh
      - name: PocketIC server and NNS / event_store wasms
        run: |
          POCKET_IC_SERVER_VERSION=$(sed -n 's/^POCKET_IC_SERVER_VERSION="\(.*\)"$/\1/p' scripts/run-integration-tests.sh)
          curl -Ls "https://github.com/dfinity/pocketic/releases/download/${POCKET_IC_SERVER_VERSION}/pocket-ic-x86_64-linux.gz" -o backend/integration_tests/pocket-ic.gz
          gzip -df backend/integration_tests/pocket-ic.gz
          chmod +x backend/integration_tests/pocket-ic
          bash ./scripts/download-nns-canister-wasm.sh icp_ledger ledger-canister_notify-method
          bash ./scripts/download-nns-canister-wasm.sh sns_wasm sns-wasm-canister
          bash ./scripts/download-nns-canister-wasm.sh icrc_ledger ic-icrc1-ledger
          bash ./scripts/download-canister-wasm-dfx.sh event_store
      - name: Run the ignored baseline upgrade tests
        run: |
          cargo test --locked -p integration_tests -- --ignored --test-threads 1 --nocapture \
            r3_upgrade v1_in_flight_draft_blocks_upgrade
