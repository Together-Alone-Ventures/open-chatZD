on:
  pull_request:
    branches:
      - master

name: Backend linting and unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: run fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      - uses: actions-rust-lang/rustfmt@v1

  clippy:
    name: run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require CVDR_VERIFY_READ_TOKEN
        env:
          CVDR_VERIFY_READ_TOKEN: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
        run: |
          if [ -z "${CVDR_VERIFY_READ_TOKEN}" ]; then
            echo "::error::CVDR_VERIFY_READ_TOKEN is required (private git deps: ICP-Delete-Leaf + CVDR-Verify)."
            exit 1
          fi
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
          private_git_token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests -- -D warnings

  unit_tests:
    name: run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require CVDR_VERIFY_READ_TOKEN
        env:
          CVDR_VERIFY_READ_TOKEN: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
        run: |
          if [ -z "${CVDR_VERIFY_READ_TOKEN}" ]; then
            echo "::error::CVDR_VERIFY_READ_TOKEN is required (private git deps: ICP-Delete-Leaf + CVDR-Verify @ v0.7.0)."
            exit 1
          fi
      - name: Clear any PR-supplied CVDR-Verify stub
        run: rm -rf CVDR-Verify
      - name: Checkout CVDR-Verify sibling @ v0.7.0 (label drift guard)
        uses: actions/checkout@v4
        with:
          repository: Together-Alone-Ventures/CVDR-Verify
          ref: v0.7.0
          path: CVDR-Verify
          token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
      - name: Require sibling OpenChatZD attestation module
        run: test -f CVDR-Verify/mktd02/mktd02-verify/src/openchatzd/index_attestation.rs
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
          private_git_token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --exclude integration_tests
