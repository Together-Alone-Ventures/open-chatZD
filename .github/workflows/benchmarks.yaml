on:
  pull_request:
    branches:
      - master

name: Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require CVDR_VERIFY_READ_TOKEN
        env:
          CVDR_VERIFY_READ_TOKEN: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}
        run: |
          if [ -z "${CVDR_VERIFY_READ_TOKEN}" ]; then
            echo "::error::CVDR_VERIFY_READ_TOKEN is required (private git deps: ICP-Delete-Leaf, zombie-core)."
            exit 1
          fi
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
          private_git_token: ${{ secrets.CVDR_VERIFY_READ_TOKEN }}

      - name: Benchmark
        run: |
          bash ./scripts/ci-run-benchmarks.sh . ${{ github.job }}

      - uses: actions/upload-artifact@v4
        with:
          name: canbench_result_${{github.job}}
          path: /tmp/canbench_result_${{ github.job }}

      - name: Save PR number
        run: |
          echo ${{ github.event.number }} > /tmp/pr_number

      - uses: actions/upload-artifact@v4
        with:
          name: pr_number
          path: /tmp/pr_number

      - name: Pass or fail
        run: |
          bash ./scripts/ci-post-run-benchmarks.sh
